name: Go CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check formatting and diff whitespace
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
          git diff --check

      - name: Go Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Govulncheck (Vulnerability Analysis)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

      - name: Run unit & contract tests with coverage
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Check OpenAPI generation sync
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          swag init -g cmd/server/main.go -o docs/openapi --parseDependency --parseInternal
          if [ -n "$(git status --porcelain docs/openapi)" ]; then
            echo "::error::OpenAPI documentation is out of sync. Please run 'swag init' and commit changes."
            git diff docs/openapi
            exit 1
          fi

      - name: Build all binaries
        run: go build ./...

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector
        run: go test -race -count=1 ./...

  cross-compile:
    name: Cross-Platform Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm64 }
          - { os: windows, arch: amd64 }
          - { os: darwin, arch: arm64 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile all binaries for ${{ matrix.target.os }}/${{ matrix.target.arch }}
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          for cmd in server worker migrate avatar-migrate bootstrap-admin; do
            ext=""
            if [ "${{ matrix.target.os }}" = "windows" ]; then
              ext=".exe"
            fi
            go build -trimpath -ldflags="-s -w" -o dist/${cmd}${ext} ./cmd/${cmd}
          done

  integration:
    name: MySQL & Redis Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_ENV: test
      APP_PORT: "8080"
      APP_FRONTEND_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: uam_test
      DB_PASSWORD: uam_test_password
      DB_TLS_MODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      JWT_SECRET: ci-only-jwt-secret-minimum-32-chars-long
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      RATE_LIMIT_WINDOW: "1m"
      LOCK_DURATION: "30m"
      OTP_EXPIRY: "5m"
      OTP_PEPPER: ci-only-otp-pepper-minimum-32-chars-long
      MFA_ISSUER: UAM CI
      MFA_ACTIVE_KEY_VERSION: v1
      MFA_ENCRYPTION_KEYS: v1:ZGV2LW9ubHktbWZhLWtleS0zMi1ieXRlcy0wMDAwMDA=
      BLOB_PROVIDER: local
      BLOB_LOCAL_ROOT: ./uploads
      UAM_MIGRATION_TEST_DB_USER: uam_test
      UAM_MIGRATION_TEST_DB_PASSWORD: uam_test_password
      UAM_MIGRATION_TEST_DB_ADDR: 127.0.0.1:3306
      UAM_AUTH_TEST_DB_NAME: uam_auth_test_ci
      UAM_AUTH_TEST_DB_ADDR: 127.0.0.1:3306
      UAM_AUTH_TEST_DB_USER: uam_test
      UAM_AUTH_TEST_DB_PASSWORD: uam_test_password
      UAM_AUTH_TEST_REDIS_ADDR: 127.0.0.1:6379
      UAM_ACCOUNT_TEST_DB_NAME: uam_account_test_ci
      UAM_ACCOUNT_TEST_DB_ADDR: 127.0.0.1:3306
      UAM_ACCOUNT_TEST_DB_USER: uam_test
      UAM_ACCOUNT_TEST_DB_PASSWORD: uam_test_password
      UAM_ACCESS_TEST_DB_HOST: 127.0.0.1
      UAM_ACCESS_TEST_DB_PORT: "3306"
      UAM_ACCESS_TEST_DB_NAME: uam_access_test_ci
      UAM_ACCESS_TEST_DB_USER: uam_test
      UAM_ACCESS_TEST_DB_PASSWORD: uam_test_password
      UAM_JOBS_TEST_DB_NAME: uam_jobs_test_ci
      UAM_JOBS_TEST_DB_ADDR: 127.0.0.1:3306
      UAM_JOBS_TEST_DB_USER: uam_test
      UAM_JOBS_TEST_DB_PASSWORD: uam_test_password
      UAM_STORE_TEST_DB_NAME: uam_store_test_ci
      UAM_STORE_TEST_DB_ADDR: 127.0.0.1:3306
      UAM_STORE_TEST_DB_USER: uam_test
      UAM_STORE_TEST_DB_PASSWORD: uam_test_password
      UAM_REDIS_TEST_ADDR: 127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes default-mysql-client

      - name: Create integration user
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot_password <<'SQL'
          CREATE USER IF NOT EXISTS 'uam_test'@'%' IDENTIFIED BY 'uam_test_password';
          SQL

      - name: Test migration history and contract
        shell: bash
        run: |
          set -euo pipefail
          reset_db() {
            local name="$1"
            mysql --protocol=tcp -h 127.0.0.1 -uroot -proot_password <<SQL
          DROP DATABASE IF EXISTS \`$name\`;
          CREATE DATABASE \`$name\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL PRIVILEGES ON \`$name\`.* TO 'uam_test'@'%';
          SQL
          }

          reset_db uam_bootstrap_migration_test_ci
          UAM_BOOTSTRAP_MIGRATION_DB_NAME=uam_bootstrap_migration_test_ci \
            go test -tags=integration -count=1 ./pkg/database \
              -run '^TestNeutralizeKnownBootstrapAdminMigration$'

          for test_name in \
            TestCanonicalSchemaEmptyDatabaseMigration \
            TestCanonicalSchemaCurrentDataMigration \
            TestCanonicalSchemaDuplicatePermissionMigrationStops
          do
            reset_db uam_canonical_migration_test_ci
            UAM_CANONICAL_MIGRATION_DB_NAME=uam_canonical_migration_test_ci \
              go test -tags=integration -count=1 ./pkg/database \
                -run "^${test_name}$"
          done

          reset_db uam_mfa_migration_test_ci_current
          reset_db uam_mfa_migration_test_ci_empty
          UAM_MFA_MIGRATION_CURRENT_DB_NAME=uam_mfa_migration_test_ci_current \
          UAM_MFA_MIGRATION_EMPTY_DB_NAME=uam_mfa_migration_test_ci_empty \
            go test -tags=integration -count=1 ./pkg/database \
              -run '^TestMFAMigration'

          reset_db uam_contract_migration_test_ci_current
          reset_db uam_contract_migration_test_ci_empty
          UAM_CONTRACT_MIGRATION_CURRENT_DB_NAME=uam_contract_migration_test_ci_current \
          UAM_CONTRACT_MIGRATION_EMPTY_DB_NAME=uam_contract_migration_test_ci_empty \
            go test -tags=integration -count=1 ./pkg/database \
              -run '^TestContractMigration'

          reset_db uam_schema_expansion_ci_empty
          reset_db uam_schema_expansion_ci_data
          UAM_SCHEMA_EXPANSION_EMPTY_DB_NAME=uam_schema_expansion_ci_empty \
          UAM_SCHEMA_EXPANSION_DATA_DB_NAME=uam_schema_expansion_ci_data \
            go test -tags=integration -count=1 ./pkg/database \
              -run '^TestCanonicalSchemaExpansionBackfill'

      - name: Prepare domain schemas
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            uam_auth_test_ci \
            uam_account_test_ci \
            uam_access_test_ci \
            uam_jobs_test_ci \
            uam_store_test_ci
          do
            mysql --protocol=tcp -h 127.0.0.1 -uroot -proot_password <<SQL
          DROP DATABASE IF EXISTS \`$name\`;
          CREATE DATABASE \`$name\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          GRANT ALL PRIVILEGES ON \`$name\`.* TO 'uam_test'@'%';
          SQL
            DB_NAME="$name" go run ./cmd/migrate
          done

      - name: Run domain and adapter integration tests
        run: >-
          go test -tags=integration -count=1 -p=1
          ./internal/auth
          ./internal/account
          ./internal/access
          ./internal/jobs
          ./internal/mysqlstore
          ./internal/redisstore

  image:
    name: Container Build & Trivy Vulnerability Scan
    needs: [quality, race, cross-compile, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: uam:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uam:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
