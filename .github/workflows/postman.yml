name: Postman API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: postman-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract-tests:
    name: Newman Postman Collection Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: uam_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: development
      APP_PORT: "8080"
      APP_FRONTEND_URL: http://localhost:3000
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: root_password
      DB_NAME: uam_db
      DB_TLS_MODE: disable
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      JWT_SECRET: super-secret-jwt-key-for-newman-test-123456789
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 168h
      RATE_LIMIT_WINDOW: 1m
      LOCK_DURATION: 30m
      OTP_EXPIRY: 5m
      OTP_PEPPER: ci-otp-pepper-super-secret-key-32b
      MFA_ISSUER: UAM CI
      MFA_ACTIVE_KEY_VERSION: v1
      MFA_ENCRYPTION_KEYS: v1:ZGV2LW9ubHktbWZhLWtleS0zMi1ieXRlcy0wMDAwMDA=
      BLOB_PROVIDER: local
      BLOB_LOCAL_ROOT: ./uploads

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Database Migrations
        run: go run ./cmd/migrate

      - name: Bootstrap Initial Admin & Roles
        env:
          UAM_BOOTSTRAP_ADMIN_PASSWORD: AdminPassword123!@#
        run: >-
          go run ./cmd/bootstrap-admin
          --username admin
          --email admin@example.com
          --full-name "Super Administrator"
          --phone "0900000000"
          --date-of-birth "2000-01-01"

      - name: Start UAM HTTP Server in Background
        run: |
          go run ./cmd/server &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

      - name: Wait for Server Readiness
        run: |
          for i in {1..30}; do
            if curl -f -s http://localhost:8080/health | grep -q '"status":"UP"'; then
              echo "Server is ready and UP!"
              exit 0
            fi
            echo "Waiting for server to become healthy... ($i/30)"
            sleep 1
          done
          echo "Server failed to start!"
          exit 1

      - name: Run Postman Collection via Newman
        run: |
          npx --yes newman run postman_collection.json \
            --insecure \
            --reporters cli,json \
            --reporter-json-export newman-report.json

      - name: Upload Newman Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-api-test-report
          path: newman-report.json
          retention-days: 14
