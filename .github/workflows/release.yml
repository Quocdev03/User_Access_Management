name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64, ext: "" }
          - { os: linux, arch: arm64, ext: "" }
          - { os: windows, arch: amd64, ext: ".exe" }
          - { os: darwin, arch: amd64, ext: "" }
          - { os: darwin, arch: arm64, ext: "" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile Binaries for ${{ matrix.target.os }}-${{ matrix.target.arch }}
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: 0
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PKG_DIR="uam-${TAG_NAME}-${{ matrix.target.os }}-${{ matrix.target.arch }}"
          mkdir -p "${PKG_DIR}/bin"

          for cmd in server worker migrate avatar-migrate bootstrap-admin; do
            go build -trimpath -ldflags="-s -w -X main.version=${TAG_NAME}" \
              -o "${PKG_DIR}/bin/${cmd}${{ matrix.target.ext }}" ./cmd/${cmd}
          done

          cp -r migrations "${PKG_DIR}/"
          cp LICENSE README.md "${PKG_DIR}/"

          if [ "${{ matrix.target.os }}" = "windows" ]; then
            zip -r "${PKG_DIR}.zip" "${PKG_DIR}"
          else
            tar -czvf "${PKG_DIR}.tar.gz" "${PKG_DIR}"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: uam-*.*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built archives
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: |
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
