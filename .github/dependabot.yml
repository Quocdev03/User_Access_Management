version: 2
updates:
  # Tự động cập nhật riêng lẻ từng Go Module (mở tối đa 100 PRs, kiểm tra hàng ngày)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 100
    rebase-strategy: "auto"
    commit-message:
      prefix: "build(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "go"

  # Tự động cập nhật riêng lẻ từng GitHub Action Workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 100
    rebase-strategy: "auto"
    commit-message:
      prefix: "build(actions)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Tự động cập nhật base image trong Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "04:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "build(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
